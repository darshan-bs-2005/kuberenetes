apiVersion: v1
kind: Pod
metadata:
  name: container-1

spec:
  containers:
    # Application Container
    - name: app-container
      image: httpd:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: log-volume
          mountPath: /usr/local/apache2/logs

    # Logging Sidecar Container
    - name: log-container
      image: busybox
      command: ["sh", "-c", "while true; do echo 'Collecting Apache Logs'; cat /var/log/apache2/access_log 2>/dev/null; sleep 10; done"]
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/apache2
          readOnly: true

  # Shared Volume
  volumes:
    - name: log-volume
      emptyDir: {}
